name: Optimize admin navigation bar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/screens/admin/admin_main_screen.dart'); s=p.read_text(); s=s.replace('            const AdminProfileScreen(),\n            const ConsultationManagementScreen(),\n            const StaffManagementScreen(),','            const ConsultationManagementScreen(),\n            const StaffManagementScreen(),\n            const AdminProfileScreen(),',1); s=s.replace(\"            NavigationDestination(icon: Icon(Icons.workspace_premium_outlined), selectedIcon: Icon(Icons.workspace_premium), label: 'Premium'),\n            NavigationDestination(icon: Icon(Icons.admin_panel_settings_outlined), selectedIcon: Icon(Icons.admin_panel_settings), label: 'Admin'),\n            NavigationDestination(icon: Icon(Icons.support_agent_outlined), selectedIcon: Icon(Icons.support_agent), label: 'Consult'),\n            NavigationDestination(icon: Icon(Icons.badge_outlined), selectedIcon: Icon(Icons.badge_rounded), label: 'Staff'),\",\"            NavigationDestination(icon: Icon(Icons.workspace_premium_outlined), selectedIcon: Icon(Icons.workspace_premium), label: 'Premium'),\n            NavigationDestination(icon: Icon(Icons.support_agent_outlined), selectedIcon: Icon(Icons.support_agent), label: 'Consult'),\n            NavigationDestination(icon: Icon(Icons.badge_outlined), selectedIcon: Icon(Icons.badge_rounded), label: 'Staff'),\n            NavigationDestination(icon: Icon(Icons.admin_panel_settings_outlined), selectedIcon: Icon(Icons.admin_panel_settings), label: 'Admin'),\",1); old='''      bottomNavigationBar: NavigationBar(\n        selectedIndex: safeIndex,\n        onDestinationSelected: _navigateTo,\n        destinations: destinations,\n      ),'''; new='''      bottomNavigationBar: SafeArea(\n        top: false,\n        child: Container(\n          height: 78,\n          decoration: BoxDecoration(\n            color: Theme.of(context).colorScheme.surface,\n            border: Border(top: BorderSide(color: Theme.of(context).colorScheme.outlineVariant)),\n          ),\n          child: SingleChildScrollView(\n            scrollDirection: Axis.horizontal,\n            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),\n            child: Row(\n              children: List.generate(destinations.length, (index) {\n                final destination = destinations[index];\n                final selected = safeIndex == index;\n                return Padding(\n                  padding: const EdgeInsets.symmetric(horizontal: 3),\n                  child: _AdminNavItem(\n                    icon: selected ? destination.selectedIcon : destination.icon,\n                    label: destination.label,\n                    selected: selected,\n                    onTap: () => _navigateTo(index),\n                  ),\n                );\n              }),\n            ),\n          ),\n        ),\n      ),'''; s=s.replace(old,new,1); marker='class _ModeTile extends StatelessWidget {'; insert='''class _AdminNavItem extends StatelessWidget {\n  final Widget icon;\n  final String label;\n  final bool selected;\n  final VoidCallback onTap;\n\n  const _AdminNavItem({required this.icon, required this.label, required this.selected, required this.onTap});\n\n  @override\n  Widget build(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return Semantics(\n      button: true,\n      selected: selected,\n      label: label,\n      child: InkWell(\n        borderRadius: BorderRadius.circular(18),\n        onTap: onTap,\n        child: AnimatedContainer(\n          duration: const Duration(milliseconds: 180),\n          constraints: const BoxConstraints(minWidth: 72),\n          padding: const EdgeInsets.symmetric(horizontal: 13, vertical: 8),\n          decoration: BoxDecoration(color: selected ? scheme.secondaryContainer : Colors.transparent, borderRadius: BorderRadius.circular(18)),\n          child: Column(\n            mainAxisSize: MainAxisSize.min,\n            children: [\n              SizedBox(height: 25, child: IconTheme(data: const IconThemeData(size: 23), child: icon)),\n              const SizedBox(height: 3),\n              Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, fontWeight: selected ? FontWeight.w800 : FontWeight.w500, color: selected ? scheme.onSecondaryContainer : scheme.onSurfaceVariant)),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n}\n\n'''; s=s.replace(marker,insert+marker,1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('lib/screens/admin/admin_dashboard_screen.dart'); s=p.read_text(); s=s.replace('_goTo(7)', '_goTo(6)').replace('_goTo(6)', '_goTo(5)'); p.write_text(s)"
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_main_screen.dart lib/screens/admin/admin_dashboard_screen.dart
          git commit -m 'Optimize admin navigation bar and move profile rightmost' || true
          git rm .github/workflows/optimize-admin-bar.yml
          git commit -m 'Remove temporary admin navigation workflow'
          git push
