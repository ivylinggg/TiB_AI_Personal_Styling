name: Fix admin navigation shortcut indices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dashboard shortcuts
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/screens/admin/admin_dashboard_screen.dart'); s=p.read_text(); s=s.replace(\"_buildStatCard('Staff', totalStaff, Icons.badge_outlined, () => _goTo(5))\", \"_buildStatCard('Staff', totalStaff, Icons.badge_outlined, () => _goTo(6))\"); s=s.replace(\"_buildStatCard('Active Staff', activeStaff, Icons.support_agent_outlined, () => _goTo(5))\", \"_buildStatCard('Active Staff', activeStaff, Icons.support_agent_outlined, () => _goTo(6))\"); p.write_text(s)"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/admin/admin_dashboard_screen.dart
          git commit -m 'Fix admin dashboard navigation shortcuts' || true
          git rm .github/workflows/fix-admin-nav-indices.yml
          git commit -m 'Remove temporary admin shortcut workflow'
          git push
