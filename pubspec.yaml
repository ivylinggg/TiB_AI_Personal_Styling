name: tib_ai_personal_styling
description: TiB AI Personal Styling & Colour App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^16.0.0

  # Camera & Gallery
  image_picker: ^1.2.0
  camera: ^0.11.2

  # AI / ML
  google_mlkit_face_detection: ^0.13.1
  image_background_remover: ^2.0.1

  # Authentication
  google_sign_in: ^7.2.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Networking
  dio: ^5.9.0
  http: ^1.5.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Image
  cached_network_image: ^3.4.1
  image: ^4.5.4

  # Animation
  lottie: ^3.3.2

  # AI Runtime
  flutter_onnxruntime: ^1.8.3

  # Calendar
  table_calendar: ^3.2.0

  # PDF / File export
  syncfusion_flutter_pdf: ^31.1.20
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/lottie/
    - assets/illustrations/
